<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
  </head>
  <body>
    <main id="app">
      <h1>Budget Tracker</h1>
      <p class="tagline">Your bank data never leaves this device.</p>

      <label class="dropzone" id="dropzone">
  <span>Choose your HSBC CSV files (select several months at once), or drop them here</span>
  <input type="file" id="file-input" accept=".csv,text/csv" multiple />
</label>

      <p id="message" role="status"></p>
      <div class="chart-wrap" hidden>
  <canvas id="category-chart" role="img" aria-label="Spending by category"></canvas>
</div>
<section id="subscriptions" hidden></section>
      <div id="results"></div>
      <button type="button" id="clear-corrections" class="link-button">Clear my saved corrections</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
